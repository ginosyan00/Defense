<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-label="Architectural aerial masterplan placeholder">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfd6d2"/>
      <stop offset="100%" stop-color="#aeb8b2"/>
    </linearGradient>
    <linearGradient id="park" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f8f76"/>
      <stop offset="100%" stop-color="#4f6d56"/>
    </linearGradient>
    <pattern id="yard" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#7f9a82"/>
      <circle cx="8" cy="10" r="2.2" fill="#5f7a64"/>
      <circle cx="20" cy="18" r="1.8" fill="#5f7a64"/>
    </pattern>
  </defs>

  <!-- Terrain -->
  <rect width="2400" height="1600" fill="url(#sky)"/>
  <rect x="0" y="220" width="2400" height="1380" fill="#8d948a"/>

  <!-- Central park -->
  <ellipse cx="1180" cy="820" rx="320" ry="220" fill="url(#park)" opacity="0.95"/>
  <ellipse cx="1180" cy="820" rx="240" ry="150" fill="#5d7a63" opacity="0.55"/>

  <!-- Roads -->
  <path d="M0 980 C500 920 900 1040 1400 980 S2100 900 2400 940" fill="none" stroke="#5c615c" stroke-width="58"/>
  <path d="M0 980 C500 920 900 1040 1400 980 S2100 900 2400 940" fill="none" stroke="#b7b9b2" stroke-width="8" stroke-dasharray="28 22"/>
  <path d="M760 200 C820 500 700 900 780 1500" fill="none" stroke="#5c615c" stroke-width="46"/>
  <path d="M760 200 C820 500 700 900 780 1500" fill="none" stroke="#b7b9b2" stroke-width="6" stroke-dasharray="22 18"/>
  <path d="M1560 180 C1500 520 1620 880 1540 1500" fill="none" stroke="#5c615c" stroke-width="46"/>

  <!-- Courtyards -->
  <rect x="430" y="470" width="420" height="290" rx="18" fill="url(#yard)" opacity="0.85"/>
  <rect x="1200" y="340" width="460" height="320" rx="18" fill="url(#yard)" opacity="0.85"/>
  <rect x="1500" y="860" width="420" height="280" rx="18" fill="url(#yard)" opacity="0.75"/>
  <rect x="650" y="980" width="380" height="260" rx="18" fill="url(#yard)" opacity="0.8"/>

  <!-- Residential blocks — District A -->
  <g fill="#d8d2c6" stroke="#6d675c" stroke-width="3">
    <rect x="450" y="500" width="70" height="180" transform="rotate(-8 450 500)"/>
    <rect x="560" y="490" width="70" height="190" transform="rotate(4 560 490)"/>
    <rect x="670" y="505" width="72" height="175" transform="rotate(-3 670 505)"/>
    <rect x="470" y="620" width="68" height="120" transform="rotate(6 470 620)"/>
    <rect x="600" y="640" width="74" height="110"/>
    <rect x="730" y="630" width="70" height="130" transform="rotate(-5 730 630)"/>
  </g>

  <!-- District B -->
  <g fill="#e2ddd2" stroke="#6d675c" stroke-width="3">
    <rect x="1240" y="380" width="78" height="200" transform="rotate(7 1240 380)"/>
    <rect x="1360" y="360" width="78" height="210"/>
    <rect x="1480" y="390" width="74" height="180" transform="rotate(-6 1480 390)"/>
    <rect x="1280" y="520" width="70" height="120"/>
  </g>

  <!-- District G (coming soon — lighter massing) -->
  <g fill="#cfc9bc" stroke="#7a7468" stroke-width="2" opacity="0.85">
    <rect x="1540" y="900" width="72" height="170"/>
    <rect x="1650" y="880" width="76" height="190" transform="rotate(5 1650 880)"/>
    <rect x="1760" y="910" width="70" height="160"/>
    <rect x="1580" y="1040" width="68" height="100"/>
  </g>

  <!-- District D -->
  <g fill="#d4cec2" stroke="#6d675c" stroke-width="3">
    <rect x="680" y="1020" width="70" height="160" transform="rotate(-4 680 1020)"/>
    <rect x="790" y="1000" width="74" height="180"/>
    <rect x="900" y="1030" width="68" height="150" transform="rotate(6 900 1030)"/>
  </g>

  <!-- Parking strips -->
  <g fill="#6a6e68" opacity="0.9">
    <rect x="390" y="780" width="220" height="36" rx="4"/>
    <rect x="1180" y="680" width="260" height="34" rx="4"/>
    <rect x="1480" y="1160" width="240" height="32" rx="4"/>
  </g>
  <g stroke="#c4c6c0" stroke-width="2">
    <path d="M400 788 H600 M400 798 H600 M400 808 H600"/>
    <path d="M1190 688 H1420 M1190 698 H1420 M1190 708 H1420"/>
  </g>

  <!-- Soft atmospheric vignette -->
  <rect width="2400" height="1600" fill="url(#sky)" opacity="0.08"/>
</svg>
